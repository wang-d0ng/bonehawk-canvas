<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas Sync</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #e6f4ea; background: #111817; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { color: #a6b8b0; margin: 0 0 12px; }
    button { width: 100%; min-height: 40px; border: 0; border-radius: 8px; background: #91db7d; color: #101810; font-weight: 700; cursor: pointer; }
    #status { margin-top: 10px; color: #a6b8b0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Canvas Workbench Sync</h1>
  <p>Open your Canvas dashboard, stay logged in, then sync. No Canvas admin or API token required.</p>
  <button id="sync">Sync Canvas to Workbench</button>
  <div id="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
