name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/apple-notary"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-notary/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-notary/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi

      - name: Build desktop app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            export BONEHAWK_MAC_SIGN_MODE=developer-id
          else
            export BONEHAWK_MAC_SIGN_MODE=adhoc
          fi
          npm run desktop:dist

      - name: Package browser extension
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"
          cd extension
          zip -r "../release/canvas-workbench-sync-extension-${VERSION}.zip" .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
